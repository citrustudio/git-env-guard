[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-env-guard"
version = "0.1.0"
description = "Static Git fixture isolation checks"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["tomli>=2,<3; python_version < '3.11'"]
license = "Apache-2.0"
readme = "README.md"

[project.scripts]
git-env-guard = "git_env_guard.cli:main"

[tool.setuptools.packages.find]
include = ["git_env_guard*"]
