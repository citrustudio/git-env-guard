name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check git_env_guard tests
      - run: mypy --strict git_env_guard
      - run: python -m git_env_guard --root examples
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: cd /tmp && git-env-guard --help
